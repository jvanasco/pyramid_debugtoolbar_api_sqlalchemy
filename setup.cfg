[metadata]
name = pyramid_debugtoolbar_api_sqlalchemy
version = attr: pyramid_debugtoolbar_api_sqlalchemy._version.__VERSION__
description = SQLAlchemy CSV exporting for pyramid_debugtoolbar
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/pyramid_debugtoolbar_api_sqlalchemy
keywords = web, pyramid, sqlalchemy
license = MIT
license_file = LICENSE
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3.5
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
packages = find:
package_dir =
    = src
include_package_data = False
zip_safe = False
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*
install_requires =
    pyramid
    pyramid_debugtoolbar>=4.0
    six
    sqlalchemy
    setuptools<82; python_version >= "3.7" and python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
pyramid_debugtoolbar_api_sqlalchemy = templates/*.dbtmako

[options.extras_require]
testing =
    coverage
    pytest

[tox:tox]
envlist = py27, py35, py36, py37, py38, py39, py310, py311, py312, py313, py314, py315

[testenv]
extras = testing
commands =
    python --version
    python -m coverage run --source=pyramid_debugtoolbar_api_sqlalchemy -m pytest {posargs:}
    python -m coverage html -d {envtmpdir}/coverage
