name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '2.7'
            image: python:2.7.18-slim-buster
          - python-version: '3.5'
            image: python:3.5.10-slim-buster
          - python-version: '3.6'
            image: python:3.6.15-slim-buster
          - python-version: '3.7'
            image: python:3.7.17-slim-bullseye
          - python-version: '3.8'
            image: python:3.8.20-slim-bookworm

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Run checkout on the host so the action's Node runtime can use the host libraries.
      - name: Run tests in the official Python image
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$PYTHON_IMAGE" sh -ec '
              python --version
              python -m pip install --upgrade pip
              python -m pip install "setuptools<82" ".[testing]"
              python -m pytest -q
            '

  current:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install "setuptools<82" ".[testing]"
      - name: Run tests
        run: python -m pytest -q
